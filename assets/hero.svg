  <desc id="hero-desc">写工具，解决那些每个人都默默忍受的小问题。 Small tools for problems everyone quietly puts up with. Terminal session: dsh plugin add notify-cues; node --test test/; wc -l lib/* → 6 chimes · 1 silence · 0 audio files. Facts shown: 2 public repos, 2 stars, 4 commits.</desc>
